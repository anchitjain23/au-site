<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verified — Au</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #080706;
    color: #F3F0E7;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: rgba(201,169,110,0.1);
    border: 1px solid rgba(201,169,110,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg { width: 28px; height: 28px; }
  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #C9A96E;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 26px;
    font-weight: 500;
    line-height: 1.35;
    margin-bottom: 14px;
    color: #F3F0E7;
  }
  p {
    font-size: 15px;
    line-height: 1.6;
    color: rgba(237,232,223,0.72);
    margin-bottom: 32px;
  }
  .btn {
    display: inline-block;
    background: #C9A96E;
    color: #080706;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    padding: 14px 32px;
    border-radius: 8px;
    transition: opacity 0.15s ease;
  }
  .btn:hover { opacity: 0.9; }
  .fallback {
    display: block;
    margin-top: 18px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: rgba(237,232,223,0.55);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .fallback:hover { color: rgba(237,232,223,0.8); }
  .wordmark {
    margin-top: 48px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: rgba(237,232,223,0.4);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#C9A96E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
    </div>
    <div class="eyebrow">Email Verified</div>
    <h1>Your email is verified!</h1>
    <p>Open the Au app to continue.</p>
    <a class="btn" href="au://auth/callback">Open Au</a>
    <a class="fallback" href="https://apps.apple.com/app/id6789685540">Don't have the app? Get it here</a>
    <div class="wordmark">Au · 79</div>
  </div>
</body>
</html>
